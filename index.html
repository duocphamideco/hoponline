  var o = { method:method, headers:{'Content-Type':'application/json'}, cache:'no-store' };
  if(body !== undefined) o.body = JSON.stringify(body);
  if(keepalive) o.keepalive = true;
  return fetch(cfgUrl(sub), o).then(function(r){ if(!r.ok) throw new Error('http' + r.status); return r.json().catch(noop); });
}
function uiErr(m){ var e = new Error(m); e.ui = true; return e; }
var hostHashP = null;
function hostHash(force){                                     // mật khẩu chủ trì hiện hành (mã băm); chưa đặt thì = mật khẩu quản trị
  if(hostHashP && !force) return hostHashP;
  hostHashP = fbGet('host').then(function(d){ return (d && /^[0-9a-f]{64}$/.test(d.hash || '')) ? d.hash : PASS_ADMIN; }, function(){ hostHashP = null; throw uiErr('Chưa đọc được mật khẩu chủ trì (mất mạng?). Thử lại sau giây lát.'); });
  return hostHashP;
}
var pendingCode = '';                                         // mở từ link mời: …#ma=ABC123
(function(){
  try{
    var m = /(^|[#&?])ma=([A-Za-z0-9]{4,12})/.exec(location.hash || '');
    if(m){ pendingCode = normCode(m[2]); history.replaceState(null, '', location.href.replace(/[#&]ma=[A-Za-z0-9]{4,12}/, '').replace(/#$/, '')); }
  }catch(_){}
})();

/* ======================= TÍN HIỆU "ĐANG CÓ NGƯỜI HỌP" ======================= */
/* Mỗi người trong phòng ghi tên + nhịp tim 20 giây/lần vào Firebase; ERP đọc lại mỗi 15 giây. */
var pres = { ok:null, list:[], seen:{}, dismissed:false, wasActive:false, lastCall:store('lastCall') || '', timer:null, fast:false, listeners:[] };
function presUrl(sub){ return PRESENCE_DB.replace(/\/+$/, '') + '/' + PRESENCE_NODE + '/' + ROOM + (sub ? '/' + sub : '') + '.json'; }
function presWrite(sub, method, body, keepalive){
  if(!PRESENCE_DB) return Promise.resolve(false);
  var o = { method:method, headers:{'Content-Type':'application/json'}, cache:'no-store' };
  if(body !== undefined) o.body = JSON.stringify(body);
  if(keepalive) o.keepalive = true;
  return fetch(presUrl(sub), o).then(function(r){ return r.ok; }, function(){ return false; });
}
function freshAt(key, ts, now){
  // Nhận biết còn sống theo việc nhịp tim THAY ĐỔI (không phụ thuộc giờ máy lệch nhau)
  var s = pres.seen[key];
  if(!s){ var age = now - ts; s = pres.seen[key] = { ts:ts, at: Math.abs(age) > 300000 ? 0 : now - clamp(age, 0, 75000) }; }
  else if(s.ts !== ts){ s.ts = ts; s.at = now; }
  return s.at;
}
function pollPresence(){
  if(!PRESENCE_DB) return;
  fetch(presUrl(), {cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('http'); return r.json(); }).then(function(d){
    var now = Date.now(), list = [], call = null;
    d = d && typeof d === 'object' ? d : {};
    Object.keys(d).forEach(function(k){
      var v = d[k]; if(!v || typeof v !== 'object') return;
      var ts = +v.ts || 0, at = freshAt(k, ts, now);
      if(k === '_call'){ if(now - at < 180000) call = { name:String(v.name || 'Đồng nghiệp').slice(0, 30), key:String(ts) }; return; }
      if(now - at < 75000) list.push({ slot:k, name:String(v.name || 'Đồng nghiệp').slice(0, 30), k:String(v.k || ''), ts:ts, h:!!v.h });
    });
    // 2.0: cùng 1 người (cùng mã mời / cùng máy chủ trì) chỉ đếm 1 lần — giữ nhịp tim mới nhất
    var byK = {}, out = [];
    list.forEach(function(p){
      if(!p.k){ out.push(p); return; }
      var o = byK[p.k];
      if(!o){ byK[p.k] = p; out.push(p); }
      else if(p.ts > o.ts){ out[out.indexOf(o)] = p; byK[p.k] = p; }
    });
    list = out;
    pres.ok = true; pres.list = list; pres.call = call;
    renderPresence();
  }).catch(function(){ pres.ok = false; renderPresence(); });
}
function presSchedule(ms){ clearTimeout(pres.timer); pres.timer = setTimeout(presLoop, ms); }
function presLoop(){ pollPresence(); presSchedule(pres.fast ? 5000 : (document.hidden ? POLL_MS * 2 : POLL_MS)); }
function startPresencePoll(){ if(PRESENCE_DB) presSchedule(2500 + Math.random() * 2500); }   // không đọc ngay lúc trang đang tải
function presFast(on){ if(!PRESENCE_DB) return; pres.fast = on; if(on) presLoop(); }   // đang mở popup: đọc 5 giây/lần
function hideBubble(){ if(bubble) bubble.classList.add('hidden'); }
function namesText(list){
  var n = list.map(function(p){ return p.name; });
  return n.length <= 3 ? n.join(', ') : n.slice(0, 3).join(', ') + ' và ' + (n.length - 3) + ' người khác';
}
function ring(){
  try{
    var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    var c = new AC(), t = c.currentTime + 0.05;
    [660, 880, 1100, 880].forEach(function(f, i){
      var o = c.createOscillator(), g = c.createGain(), st = t + i * 0.16;
      o.frequency.value = f; g.gain.setValueAtTime(0.0001, st); g.gain.linearRampToValueAtTime(0.1, st + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, st + 0.15);
      o.connect(g); g.connect(c.destination); o.start(st); o.stop(st + 0.16);
    });
    setTimeout(function(){ try{ c.close(); }catch(_){} }, 1200);
  }catch(_){}
}
function renderPresence(){
  pres.listeners.forEach(function(f){ try{ f(); }catch(_){} });
  if(!btn) return;
  var inMeet = !!(app && app.isJoined());
  var n = pres.list.length, active = n > 0;
  badge.textContent = n; badge.classList.toggle('hidden', !active || inMeet);
  btn.classList.toggle('active', active && !inMeet && !btn.classList.contains('mini'));
  btn.title = active ? (n + ' người đang họp: ' + namesText(pres.list)) : 'Họp video nội bộ';
  if(!active){ pres.wasActive = false; pres.dismissed = false; hideBubble(); return; }
  if(app || chatBusy()){ hideBubble(); return; }         // đang mở khung họp / đang có popup tin nhắn thì không cần nhắc
  var call = pres.call, fresh = call && call.key !== pres.lastCall && call.name !== (store('name') || '');
  if(fresh){
    pres.lastCall = call.key; store('lastCall', call.key); pres.dismissed = false;
    bubble.querySelector('.bt').innerHTML = '📣 <b>' + esc(call.name) + '</b> đang mời mọi người vào họp video.<br>Đang có ' + n + ' người: ' + esc(namesText(pres.list));
    bubble.classList.remove('hidden'); ring();
  }else if(!pres.wasActive && !pres.dismissed){
    bubble.querySelector('.bt').innerHTML = '🟢 Đang có cuộc họp video: <b>' + esc(namesText(pres.list)) + '</b>';
    bubble.classList.remove('hidden');
  }
  pres.wasActive = true;
}

var chat = { on:!!CHAT_DB, msgs:{}, keys:[], ready:false, open:false, unread:0, seen:store('chatSeen') || '', cid:store('cid') || '', tid:Math.random().toString(36).slice(2, 10) + Date.now().toString(36), other:{},
             es:null, fails:0, pollT:null, pollN:0, popKey:'', denied:false, mode:'off', sending:false, listeners:[] };
if(!chat.cid){ chat.cid = Math.random().toString(36).slice(2, 10) + Date.now().toString(36); store('cid', chat.cid); }
function chatUrl(q){ return CHAT_DB.replace(/\/+$/, '') + '/' + CHAT_NODE + '/' + ROOM + '.json' + (q || ''); }
function chatQuery(){ return '?orderBy=%22%24key%22&limitToLast=' + CHAT_KEEP; }
function chatBusy(){ return !!(msgPop && !msgPop.classList.contains('hidden')) || chat.open; }
function chatMine(k){ var m = chat.msgs[k]; return !!m && m.cid === chat.cid; }                 // tin gửi từ trình duyệt này (hiện chữ "Bạn")
function chatSelf(k){ return chatMine(k) && !chat.other[k]; }                                    // …và không phải vừa đến từ một thẻ khác → không cần báo
var titleT = null, titleOld = '';
function titleBlink(who){                                   // tiêu đề thẻ cũng nháy để thấy khi đang ở thẻ khác
  if(!who){ if(titleT){ clearInterval(titleT); titleT = null; document.title = titleOld; } return; }

    else chat.msgs = (data && typeof data === 'object') ? data : {};

    var seg = p.split('/'), id = seg[0];

      else chat.msgs[id] = data;

        chatApply(d.path, d.data, patch);
      }; };
      var drop = function(){ if(chat.es === es){ try{ es.close(); }catch(_){} chat.es = null; chatStartPoll(); } };

/* ---- 2.0: ĐÍNH KÈM FILE (ảnh, Excel, Word, PDF…) ----

var fileBusy = false;

        var u2 = scaleImg(img, 2400, 0.86); meta.t = 'image/jpeg'; meta.n = fname.replace(/\.[^.]+$/, '') + '.jpg';

  var old = el.tagName === 'BUTTON' ? el.querySelector('small').textContent : '';
  if(old) el.querySelector('small').textContent = 'đang tải…';
  fbGet('files_' + ROOM + '/' + fid).then(function(d){
    if(!d || !d.d) throw new Error('gone');
    var url = Object.keys(d.d).sort(function(a, b){ return +a.slice(1) - +b.slice(1); }).map(function(k){ return d.d[k]; }).join('');
    var i = url.indexOf(','), bin = atob(url.slice(i + 1)), u8 = new Uint8Array(bin.length);
    for(var j = 0; j < bin.length; j++) u8[j] = bin.charCodeAt(j);
    var blob = new Blob([u8], { type:d.t || 'application/octet-stream' }), bu = URL.createObjectURL(blob);
    setTimeout(function(){ URL.revokeObjectURL(bu); }, 300000);
    var lb = sroot.querySelector('.lbox'), dl = lb.querySelector('.lbDl');
    if(/^image\//.test(d.t || '')){
      lb.querySelector('img').src = bu; lb.querySelector('.lbName').textContent = d.n || '';
      dl.href = bu; dl.setAttribute('download', d.n || 'anh.jpg'); lb.classList.remove('hidden');
    }else{
      var a = document.createElement('a'); a.href = bu; a.download = d.n || 'file'; a.style.display = 'none';
      sroot.appendChild(a); a.click(); a.remove();
      toast('Đang tải về: ' + (d.n || 'file'));
    }
  }).catch(function(e){ toast(e && e.message === 'gone' ? 'File không còn (đã quá ' + FILE_DAYS + ' ngày hoặc đã bị xoá).' : 'Chưa tải được file – kiểm tra mạng.'); })
    .then(function(){ delete el.dataset.busy; if(old) el.querySelector('small').textContent = old; });
}
function fileCleanup(){                                     // xoá file đã quá FILE_DAYS ngày
  if(!CHAT_DB) return;
  fetch(cfgUrl('files_' + ROOM) + '?shallow=true', { cache:'no-store' }).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
    if(!d || typeof d !== 'object') return;
    var lim = Date.now() - FILE_DAYS * 86400000, del = {}, n = 0;
    Object.keys(d).forEach(function(k){ var t = +(k.match(/^f(\d{12,14})_/) || [])[1]; if(!t || t < lim){ del[k] = null; n++; } });
    if(n) fetch(cfgUrl('files_' + ROOM), { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(del) }).catch(noop);
  }).catch(noop);
}

/* ---- "đang nhập": máy đang gõ ghi nhịp vào Firebase, máy khác thấy dòng nhấp nháy ---- */
var typ = { es:null, map:{}, lastSent:0, active:false, sendT:null, idleT:null, t:null };
function typUrl(sub){ return CHAT_DB.replace(/\/+$/, '') + '/' + CHAT_NODE + '_typing/' + ROOM + (sub ? '/' + sub : '') + '.json'; }
function typConnect(){
  if(!chat.on || !CHAT_TYPING || typ.es || typeof window.EventSource !== 'function') return;
  try{
    var es = new EventSource(typUrl()), first = true; typ.es = es;
    var on = function(patch){ return function(ev){
      var d = null; try{ d = JSON.parse(ev.data); }catch(_){}
      if(!d) return;
      typApply(d.path, d.data, patch, first); first = false;
    }; };
    es.addEventListener('put', on(false)); es.addEventListener('patch', on(true));
    es.onerror = function(){ if(es.readyState === 2 && typ.es === es) typ.es = null; };
  }catch(_){ typ.es = null; }
}
function typApply(path, data, isPatch, initial){
  var p = String(path || '/').replace(/^\/+/, ''), now = Date.now();
  var set = function(id, v){
    if(id === chat.tid) return;
    if(!v || typeof v !== 'object' || !v.name){ delete typ.map[id]; return; }
    typ.map[id] = { name:String(v.name).slice(0, 30), text:typeof v.text === 'string' ? v.text.slice(0, 120) : '', at:initial ? 0 : now };   // dòng cũ còn sót lúc mới mở trang: bỏ qua
  };
  if(!p){
    if(!isPatch) typ.map = {};
    if(data && typeof data === 'object') Object.keys(data).forEach(function(k){ set(k, data[k]); });
  }else{
    var sg = p.split('/'), m = typ.map[sg[0]];
    if(sg.length === 1) set(sg[0], data);
    else if(m){ if(sg[1] === 'text') m.text = String(data == null ? '' : data).slice(0, 120); m.at = now; }
  }
  typRender();
}
function typRender(){
  if(!typChip) return;
  var now = Date.now(), act = Object.keys(typ.map).map(function(k){ return typ.map[k]; }).filter(function(m){ return now - m.at < 7000; });
  var txt = '';
  if(act.length){
    var m = act[act.length - 1];
    txt = '✍️ ' + (act.length > 1 ? act.length + ' người đang nhập…' : m.name + ' đang nhập' + (m.text ? ': ' + m.text : '…'));
  }
  chatTy.textContent = txt; chatTy.classList.toggle('hidden', !txt || !chat.open);
  var outside = !!txt && !chat.open, inRoom = !!(app && app.isOpen());
  typChip.textContent = txt; typChip.classList.toggle('hidden', !outside || inRoom);
  chatBtn.classList.toggle('typing', outside);
  if(chat.typing !== outside){ chat.typing = outside; chat.listeners.forEach(function(f){ try{ f(); }catch(_){} }); }
  clearTimeout(typ.t); if(act.length) typ.t = setTimeout(typRender, 1000);
}
function chatTypingPing(){
  if(!CHAT_TYPING || !chat.on) return;
  var text = chatIn.value.replace(/\s+/g, ' ').trim();
  if(!text){ chatTypingStop(); return; }
  var now = Date.now();
  if(now - typ.lastSent < 1200){ clearTimeout(typ.sendT); typ.sendT = setTimeout(chatTypingPing, 1250); return; }
  typ.lastSent = now; typ.active = true;
  var name = ((store('name') || '').trim() || chatName.value.trim() || 'Đồng nghiệp').slice(0, 30);
  fetch(typUrl(chat.tid), { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ name:name, text:CHAT_TYPING_TEXT ? text.slice(0, 120) : '', ts:{'.sv':'timestamp'} }) }).catch(noop);
  clearTimeout(typ.idleT); typ.idleT = setTimeout(chatTypingStop, 6000);   // ngừng gõ 6 giây → tự hết "đang nhập"
}
function chatTypingStop(){
  clearTimeout(typ.sendT); clearTimeout(typ.idleT);
  if(!typ.active) return;
  typ.active = false; typ.lastSent = 0;
  try{ fetch(typUrl(chat.tid), { method:'DELETE', keepalive:true }).catch(noop); }catch(_){}
}
/* ======================= MẬT KHẨU VÀO ỨNG DỤNG (chỉ trang website) ======================= */
var gate = { cur:store('pwCur') || PASS_DEFAULT, p:null, done:!REQUIRE_PASS, then:null };
function passUrl(){ return CHAT_DB.replace(/\/+$/, '') + '/' + PASS_NODE + '/pass.json'; }
function gateLoad(force){                                   // đọc mật khẩu hiện hành (mã băm) từ Firebase
  if(!REQUIRE_PASS) return Promise.resolve();
  if(gate.p && !force) return gate.p;
  var wait = new Promise(function(res){ setTimeout(res, 3500); });
  var get = !CHAT_DB ? Promise.resolve() : fetch(passUrl(), { cache:'no-store' }).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
    if(d && typeof d.hash === 'string' && /^[0-9a-f]{64}$/.test(d.hash)){ gate.cur = d.hash; store('pwCur', d.hash); }
  }).catch(noop);
  gate.p = Promise.race([get, wait]).then(function(){ gate.done = true; });
  return gate.p;
}
function unlocked(){ return !REQUIRE_PASS || store('pw') === gate.cur; }
function withGate(fn){
  if(!REQUIRE_PASS){ fn(); return; }
  var go = function(){ if(unlocked()) fn(); else lockShow(fn); };
  if(gate.done) go(); else gateLoad().then(go);
}
function lockShow(fn){

}
function lockSubmit(){

    lockEl.classList.add('hidden'); lockIn.value = ''; lockErr.textContent = '';

  });
}

  function bgPlate(w, h){
    var key = bgMode + w + 'x' + h;

    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var x = c.getContext('2d');
    if(bgMode === 'ideco'){
      var g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#e8ecf2');
      x.fillStyle = g; x.fillRect(0, 0, w, h);
      var base = Math.min(w, h * 16 / 9);
      var fs = Math.round(base * 0.085), px = Math.round(w * 0.05), py = Math.round(h * 0.06);
      x.fillStyle = '#d71920'; x.textBaseline = 'top';
      x.font = '800 ' + fs + 'px "Segoe UI",Roboto,Arial,sans-serif';
      x.fillText('IDECO', px, py);
      x.fillRect(px, py + Math.round(fs * 1.08), Math.round(fs * 1.4), Math.max(3, Math.round(fs * 0.07)));
      var sb = Math.max(4, Math.round(h * 0.014));

    if(canFilter) x.filter = 'blur(3px)';

    x.globalCompositeOperation = 'source-in';
    x.drawImage(r.image, 0, 0, w, h);

  /* Người chủ trì: mở cuộc họp mới hoặc vào lại cuộc họp đang diễn ra (trong MEET_KEEP_MS) */
  function hostSeat(){
    var pw = $('inHost').value;
    return hostHash(true).then(function(hh){
      var key;
      if(pw){
        if(hashPw(pw) !== hh) throw uiErr('Mật khẩu chủ trì chưa đúng.');
        key = sha256('room|' + ROOM + '|' + pw);
        store('hostH', hh); store('hostK', key); $('inHost').value = '';
      }else{
        if(store('hostH') !== hh || !store('hostK')){ store('hostH', ''); store('hostK', ''); setRole('host'); throw uiErr('Mật khẩu chủ trì vừa được đổi – hãy nhập mật khẩu mới.'); }

      roomKey = key;

      return fbGet('room_' + ROOM).catch(function(){ return null; }).then(function(rm){
        var mid = '';
        if(rm && rm.m && rm.mh){
          var x = unxorHex(rm.m, rk);
          var live = (Date.now() - (+rm.at || 0) < MEET_KEEP_MS) || (pres.ok && pres.list.length > 0);
          if(/^[a-z0-9]{10}$/.test(x) && meetHash(x) === rm.mh && live) mid = x;
        }
        var fresh = !mid;
        if(fresh) mid = rnd(10);
        var put = fbSend('room_' + ROOM, 'PUT', { m:xorHex(mid, rk), mh:meetHash(mid), host:myName, at:{'.sv':'timestamp'}, v:2 });
        if(fresh) put = put.then(function(){ return fbSend('inv_' + ROOM, 'DELETE').catch(noop); });   // cuộc họp mới: bỏ hết mã cũ
        return put.then(function(){ return { meet:mid, key:'h:' + DEV, seq:Date.now(), host:true, fresh:fresh }; });
      });

      if(e && e.ui) throw e;
      throw uiErr('Chưa ghi được lên Firebase để mở cuộc họp (kiểm tra mạng hoặc quyền ghi nút "' + PASS_NODE + '").');
    });

  function guestSeat(code){
    var id = codeId(code);

      var iv = a[0], rm = a[1];

      if(iv.rv) throw uiErr('Mã mời này đã bị người chủ trì thu hồi.');
      var mid = unxorHex(iv.m, sha256('code|' + code));
      if(!/^[a-z0-9]{10}$/.test(mid)) throw uiErr('Mã mời không đúng.');
      if(!rm || rm.mh !== meetHash(mid)) throw uiErr('Cuộc họp của mã mời này đã kết thúc.');
      var seq = ((iv.use && +iv.use.n) || 0) + 1;
      return fbSend('inv_' + ROOM + '/' + id + '/use', 'PUT', { name:myName, dev:DEV, n:seq, at:{'.sv':'timestamp'} }).catch(noop).then(function(){
        store('code', code);
        return { meet:mid, key:'c:' + id, seq:seq, host:false, codeId:id };
      });
    }).catch(function(e){

  /* ---------- vào phòng: nhận 1 trong các "ghế" ---------- */
  function presSlots(){ return pres.ok ? pres.list.map(function(p){ return +p.slot; }).filter(function(n){ return n >= 1 && n <= MAX; }) : []; }
  // Thử ghế đang trống (theo danh sách người đang họp) trước → vào phòng nhanh hơn
  function slotOrder(){
    var busy = presSlots(), free = [], rest = [];
    for(var s = 1; s <= MAX; s++) (busy.indexOf(s) < 0 ? free : rest).push(s);
    return free.concat(rest);
  }
  function newPeer(id){ return new window.Peer(id, { config:{ iceServers:ICE_SERVERS, sdpSemantics:'unified-plan' }, debug:0 }); }
  function claimSlot(order, i){
    if(dead) return;
    if(i >= order.length){ backToLobby('Phòng đã đủ ' + MAX + ' người. Hãy thử lại sau.'); return; }
    var n = order[i], id = slotId(n), opened = false, backoff = 1000;
    var p = newPeer(id); claiming = p;
    p.on('open', function(){
      if(dead) return;
      backoff = 1000;
      if(opened){ rescan(true); return; }        // nối lại máy chủ sau khi rớt mạng → tìm lại mọi người ngay
      opened = true; claiming = null; peer = p; mySlot = n; enterRoom();
    });
    p.on('error', function(e){
      if(!opened){
        try{ p.destroy(); }catch(_){}
        if(claiming === p) claiming = null;
        if(dead) return;
        if(e.type === 'unavailable-id') claimSlot(order, i + 1);
        else backToLobby('Không kết nối được máy chủ (' + e.type + '). Kiểm tra internet rồi thử lại.');
        return;
      }
      if(e.type === 'peer-unavailable'){
        var m = /peer\s+([\w-]+)/i.exec(e.message || ''), pid = m && m[1];
        if(pid && peers[pid] && !peers[pid].known) removePeer(pid);   // ghế trống: bỏ, không tạo khung "ma"
        return;
      }
      if(/network|disconnected|server-error|socket/.test(e.type)) toast('Mạng chập chờn, đang kết nối lại…');
    });
    p.on('disconnected', function(){
      if(dead || !opened) return;
      var retry = function(){
        if(dead || p.destroyed || !p.disconnected) return;
        try{ p.reconnect(); }catch(_){}
        backoff = Math.min(backoff * 2, 8000);
        setTimeout(retry, backoff);
      };
      setTimeout(retry, backoff);
    });
    p.on('connection', function(conn){ if(!dead) setupConn(conn, false); });
    p.on('call', function(call){
      if(dead) return;
      if(!acceptCall(call, false)) return;
      call.answer(outStream, { sdpTransform:sdpTune });
      setupCall(call);
    });
  }

        try{ t.v.srcObject = !src ? null : (me ? new MediaStream([src]) : src); }catch(_){}
        if(src) pipPlay(t.v);
      }else if(src && t.v.paused) pipPlay(t.v);
      var c = t.el.classList;
      c.toggle('camoff', me ? !st.cam : (!st.cam && !st.share));
      c.toggle('sharing', !me && !!st.share);
      c.toggle('micon', !!st.mic);
      c.toggle('mirror', me && !!localTile && localTile.classList.contains('mirror'));
      var txt = (st.mic ? '🎤 ' : '🔇 ') + (me && st.share ? '🖥️ ' : '') + st.name + (me ? ' (bạn)' : '');
      if(t.lb.textContent !== txt) t.lb.textContent = txt;
      var ch = (st.name.trim()[0] || '?').toUpperCase();
      if(t.av.textContent !== ch) t.av.textContent = ch;
    });
    Object.keys(ui.tiles).forEach(function(id){
      if(seen[id]) return;
      var t = ui.tiles[id]; try{ t.v.srcObject = null; }catch(_){}
      t.el.remove(); delete ui.tiles[id];
    });
    var sig = fitPip(ui);
    if(sig !== ui.sig){ ui.sig = sig; if(!noQueue) queueViews(); }
  }
  // 🗗 Chrome / Edge máy tính: đưa khung ra cửa sổ riêng luôn nổi trên mọi cửa sổ (Excel, ứng dụng khác…)
  function popOut(){
    if(!CAN_POP || pipOut || !pipIn || dead) return;
    var r = pipIn.el.getBoundingClientRect(), p;
    try{ p = window.documentPictureInPicture.requestWindow({ width:Math.round(clamp(r.width, 300, 960)), height:Math.round(clamp(r.height, 240, 720)) }); }
    catch(e){ p = Promise.reject(e); }
    p.then(function(w){
      if(dead || !joined){ try{ w.close(); }catch(_){} return; }
      var d = w.document;
      try{ d.title = 'IDECO Meet'; d.documentElement.lang = 'vi'; }catch(_){}
      var st = d.createElement('style');
      st.textContent = '*{box-sizing:border-box}html,body{margin:0;height:100%;background:#1a2232;overflow:hidden}button{font:inherit;color:inherit}.hidden{display:none!important}\n' + PIP_CSS;
      d.head.appendChild(st);
      pipWin = w; pipOut = buildPip(d, true); d.body.appendChild(pipOut.el);
      w.addEventListener('pagehide', function(){
        if(pipWin !== w) return;                 // đóng cửa sổ nổi → khung quay về nằm trong trang
        pipWin = null; pipOut = null;
        if(!dead){ syncPip(true); reportViews(); }
      });
      w.addEventListener('resize', function(){ if(pipWin === w) syncPip(); });
      if(!minimized) minimizeMeet();
      pipState(); syncPip(true); reportViews();
      toast('Khung họp đang nổi trên mọi cửa sổ – chuyển sang Excel hay ứng dụng khác vẫn thấy mọi người.');
    }).catch(function(){
      toast('Không mở được khung nổi trên mọi cửa sổ. Tính năng này cần Chrome hoặc Edge bản mới trên máy tính.');
    });
  }
  function closePip(){
    if(!pipWin) return;
    var w = pipWin; pipWin = null; pipOut = null;
    try{ w.close(); }catch(_){}
  }
  $('btnLeave').onclick = function(){ teardown(); toast('Bạn đã rời cuộc họp.'); };
  on(window, 'pagehide', function(){ teardown(); });

  function teardown(){
    if(dead) return;
    try{ broadcast({t:'bye'}); }catch(_){}
    var wasJoined = joined;
    dead = true; joined = false;
    if(wasJoined && mySlot) presWrite(String(mySlot), 'DELETE', undefined, true);
    presFast(false);
    pres.listeners = pres.listeners.filter(function(f){ return f !== lobbyPresence; });
    chat.listeners = chat.listeners.filter(function(f){ return f !== chatBadgeRoom; });
    stopTicker();
    Object.keys(peers).forEach(function(id){
      var pr = peers[id];
      pr.conns.forEach(function(c){ try{ c.close(); }catch(_){} });
      if(pr.call){ try{ pr.call.close(); }catch(_){} }
      try{ pr.video.srcObject = null; }catch(_){}
    });
    peers = {};
    [screenTrack, procTrack, camTrack, rawCam, micTrack, meterTrack, blackT].forEach(function(t){ try{ if(t) t.stop(); }catch(_){} });
    if(seg){ try{ seg.close(); }catch(_){} }
    var pp = peer;
    setTimeout(function(){ try{ if(pp) pp.destroy(); }catch(_){} }, 300);
    try{ if(claiming) claiming.destroy(); }catch(_){}
    try{ if(chan) chan.close(); }catch(_){}
    try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(_){}
    offs.forEach(function(f){ try{ f(); }catch(_){} });
    timers.forEach(clearInterval);
    if(ro) ro.disconnect();
    try{ if(wakeLock) wakeLock.release(); }catch(_){}
    try{ srcVideo.srcObject = null; }catch(_){}
    try{ if(actx) actx.close(); }catch(_){}
    closePip();
    if(pipIn){ pipClear(pipIn); pipIn.el.remove(); pipIn = null; }
    ov.remove();
    app = null; setBtn('idle');
    if(wasJoined){ pres.list = pres.list.filter(function(p){ return p.slot !== String(mySlot); }); pres.dismissed = true; renderPresence(); }
  }

  return {
    restore: restoreMeet,
    leave: teardown,
    isJoined: function(){ return joined; },
    isOpen: function(){ return !minimized; },
    status: function(){ return { role:isHost ? 'host' : (INVITE ? 'guest' : 'open'), seat:myKey, meet:meetId ? meetHash(meetId).slice(0, 6) : '', spkOff:prefs.spkOff, near:Object.keys(peers).filter(function(k){ return peers[k].near; }).map(function(k){ return peers[k].state.name; }), joined:joined, minimized:minimized, float:pipOut ? 'window' : (minimized && joined ? 'page' : 'off'), slot:mySlot, people:tileCount() + (joined ? 1 : 0), mic:micOn, cam:camOn, bg:bgMode, mobile:IS_MOBILE }; }
  };
}

/* ---------- tinh chỉnh SDP: tiếng chống rè/mất (FEC + RED), hình nét ngay từ giây đầu ---------- */
function sdpTune(sdp){
  try{
    var opus = (sdp.match(/a=rtpmap:(\d+) opus\/48000/i) || [])[1];
    if(opus){
      var fix = function(str){
        var m = {}, keys = [];
        str.split(';').forEach(function(kv){ var i = kv.indexOf('='); if(i > 0){ var k = kv.slice(0, i).trim(); if(!(k in m)) keys.push(k); m[k] = kv.slice(i + 1).trim(); } });
        // useinbandfec: tự vá gói tiếng bị mất · usedtx=0: tiếng liền, không ngắt quãng · mono 40 kbps: giọng nói rõ
        [['useinbandfec','1'], ['usedtx','0'], ['stereo','0'], ['sprop-stereo','0'], ['maxaveragebitrate','40000']].forEach(function(x){ if(!(x[0] in m)) keys.push(x[0]); m[x[0]] = x[1]; });
        return keys.map(function(k){ return k + '=' + m[k]; }).join(';');
      };
      var re = new RegExp('a=fmtp:' + opus + ' ([^\\r\\n]*)');
      if(re.test(sdp)) sdp = sdp.replace(re, function(_, prm){ return 'a=fmtp:' + opus + ' ' + fix(prm); });
      else sdp = sdp.replace(new RegExp('(a=rtpmap:' + opus + ' opus/48000[^\\r\\n]*\\r\\n)', 'i'), '$1a=fmtp:' + opus + ' ' + fix('') + '\r\n');
    }
    // RED: gửi kèm bản dự phòng của gói tiếng trước → mạng 4G rớt gói vẫn nghe liền
    var red = (sdp.match(/a=rtpmap:(\d+) red\/48000/i) || [])[1];
    if(red) sdp = sdp.replace(/(m=audio \d+ [A-Z\/]+ )([\d ]+)/, function(_, h, pts){
      return h + [red].concat(pts.trim().split(' ').filter(function(x){ return x !== red; })).join(' ');
    });
    // Hình: bắt đầu ở mức bitrate khá (không mờ mấy giây đầu), không tụt quá thấp
    var start = IS_MOBILE ? 500 : 800, vids = [];
    sdp.replace(/a=rtpmap:(\d+) (VP8|VP9|H264|AV1)\/90000/gi, function(_, pt){ vids.push(pt); return _; });
    vids.forEach(function(pt){
      var add = 'x-google-start-bitrate=' + start + ';x-google-min-bitrate=120';
      var r2 = new RegExp('a=fmtp:' + pt + ' ([^\\r\\n]*)');
      if(r2.test(sdp)) sdp = sdp.replace(r2, function(line, prm){ return /x-google-start-bitrate/.test(prm) ? line : 'a=fmtp:' + pt + ' ' + prm + ';' + add; });
      else sdp = sdp.replace(new RegExp('(a=rtpmap:' + pt + ' [A-Za-z0-9]+/90000\\r\\n)'), '$1a=fmtp:' + pt + ' ' + add + '\r\n');
    });
  }catch(_){}
  return sdp;
}

/* ---------- nạp thư viện khi cần (chỉ nạp 1 lần) ---------- */
var libs = {};
function loadScript(url, ready){
  if(ready()) return Promise.resolve();
  if(libs[url]) return libs[url];
  libs[url] = new Promise(function(res, rej){
    var s = document.createElement('script'); s.src = url; s.async = true; s.crossOrigin = 'anonymous';
    s.onload = function(){ ready() ? res() : rej(new Error('lib')); };
    s.onerror = function(){ rej(new Error('lib')); };
    document.head.appendChild(s);
  });
  libs[url].catch(function(){ delete libs[url]; });
  return libs[url];
}
function loadPeerLib(){ return loadScript(PEERJS_URL, function(){ return typeof window.Peer === 'function'; }); }
function loadSegLib(){ return loadScript(SEG_BASE + 'selfie_segmentation.js', function(){ return typeof window.SelfieSegmentation === 'function'; }); }

    return s;
  }
};
