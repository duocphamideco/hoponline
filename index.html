/* ======================= TÍN HIỆU "ĐANG CÓ NGƯỜI HỌP" ======================= */
/* Mỗi người trong phòng ghi tên + nhịp tim 20 giây/lần vào Firebase; ERP đọc lại mỗi 15 giây. */
var pres = { ok:null, list:[], seen:{}, dismissed:false, wasActive:false, lastCall:store('lastCall') || '', timer:null, fast:false, listeners:[] };
function presUrl(sub){ return PRESENCE_DB.replace(/\/+$/, '') + '/' + PRESENCE_NODE + '/' + ROOM + (sub ? '/' + sub : '') + '.json'; }
function presWrite(sub, method, body, keepalive){
  if(!PRESENCE_DB) return Promise.resolve(false);
  var o = { method:method, headers:{'Content-Type':'application/json'}, cache:'no-store' };
  if(body !== undefined) o.body = JSON.stringify(body);
  if(keepalive) o.keepalive = true;
  return fetch(presUrl(sub), o).then(function(r){ return r.ok; }, function(){ return false; });
}
function freshAt(key, ts, now){
  // Nhận biết còn sống theo việc nhịp tim THAY ĐỔI (không phụ thuộc giờ máy lệch nhau)
  var s = pres.seen[key];
  if(!s){ var age = now - ts; s = pres.seen[key] = { ts:ts, at: Math.abs(age) > 300000 ? 0 : now - clamp(age, 0, 75000) }; }
  else if(s.ts !== ts){ s.ts = ts; s.at = now; }
  return s.at;
}
function pollPresence(){
  if(!PRESENCE_DB) return;
  fetch(presUrl(), {cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('http'); return r.json(); }).then(function(d){
    var now = Date.now(), list = [], call = null;
    d = d && typeof d === 'object' ? d : {};
    Object.keys(d).forEach(function(k){
      var v = d[k]; if(!v || typeof v !== 'object') return;
      var ts = +v.ts || 0, at = freshAt(k, ts, now);
      if(k === '_call'){ if(now - at < 180000) call = { name:String(v.name || 'Đồng nghiệp').slice(0, 30), key:String(ts) }; return; }
      if(now - at < 75000) list.push({ slot:k, name:String(v.name || 'Đồng nghiệp').slice(0, 30) });
    });
    pres.ok = true; pres.list = list; pres.call = call;
    renderPresence();
  }).catch(function(){ pres.ok = false; renderPresence(); });
}
function presSchedule(ms){ clearTimeout(pres.timer); pres.timer = setTimeout(presLoop, ms); }
function presLoop(){ pollPresence(); presSchedule(pres.fast ? 5000 : (document.hidden ? POLL_MS * 2 : POLL_MS)); }
function startPresencePoll(){ if(PRESENCE_DB) presSchedule(2500 + Math.random() * 2500); }   // không đọc ngay lúc trang đang tải
function presFast(on){ if(!PRESENCE_DB) return; pres.fast = on; if(on) presLoop(); }   // đang mở popup: đọc 5 giây/lần
function hideBubble(){ if(bubble) bubble.classList.add('hidden'); }
function namesText(list){
  var n = list.map(function(p){ return p.name; });
  return n.length <= 3 ? n.join(', ') : n.slice(0, 3).join(', ') + ' và ' + (n.length - 3) + ' người khác';
}
function ring(){
  try{
    var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    var c = new AC(), t = c.currentTime + 0.05;
    [660, 880, 1100, 880].forEach(function(f, i){
      var o = c.createOscillator(), g = c.createGain(), st = t + i * 0.16;
      o.frequency.value = f; g.gain.setValueAtTime(0.0001, st); g.gain.linearRampToValueAtTime(0.1, st + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, st + 0.15);
      o.connect(g); g.connect(c.destination); o.start(st); o.stop(st + 0.16);
    });
    setTimeout(function(){ try{ c.close(); }catch(_){} }, 1200);
  }catch(_){}
}
function renderPresence(){
  pres.listeners.forEach(function(f){ try{ f(); }catch(_){} });
  if(!btn) return;
  var inMeet = !!(app && app.isJoined());
  var n = pres.list.length, active = n > 0;
  badge.textContent = n; badge.classList.toggle('hidden', !active || inMeet);
  btn.classList.toggle('active', active && !inMeet && !btn.classList.contains('mini'));
  btn.title = active ? (n + ' người đang họp: ' + namesText(pres.list)) : 'Họp video nội bộ';
  if(!active){ pres.wasActive = false; pres.dismissed = false; hideBubble(); return; }
  if(app){ hideBubble(); return; }                       // đang mở khung họp thì không cần nhắc
  var call = pres.call, fresh = call && call.key !== pres.lastCall && call.name !== (store('name') || '');
  if(fresh){
    pres.lastCall = call.key; store('lastCall', call.key); pres.dismissed = false;
    bubble.querySelector('.bt').innerHTML = '📣 <b>' + esc(call.name) + '</b> đang mời mọi người vào họp video.<br>Đang có ' + n + ' người: ' + esc(namesText(pres.list));
    bubble.classList.remove('hidden'); ring();
  }else if(!pres.wasActive && !pres.dismissed){
    bubble.querySelector('.bt').innerHTML = '🟢 Đang có cuộc họp video: <b>' + esc(namesText(pres.list)) + '</b>';
    bubble.classList.remove('hidden');
  }
  pres.wasActive = true;
}

  function every(fn, ms){ var i = setInterval(fn, ms); timers.push(i); return i; }

  /* ---------- trạng thái ---------- */
  var peer = null, claiming = null, mySlot = 0, myName = '', joined = false, joinedAt = 0, wakeLock = null;
  var rawCam = null, procTrack = null, camTrack = null, micTrack = null, meterTrack = null, screenTrack = null, outStream = null, blackT = null;
  var hasCam = false, hasMic = false, micOn = false, camOn = false, camCount = 0;
  var peers = {}, pendingConn = {};

  var stage = $('stage'), srcVideo = $('srcVideo'), pttBtn = $('btnPTT');
  var localTile = null, localVideo = null, zTop = 10, ro = null;
  var prefs = {
    cam: store('cam') || '', mic: store('mic') || '', spk: store('spk') || '',
    bg: store('bg') || (IS_MOBILE ? 'none' : 'ideco'), bright: store('bright') !== '0', beep: store('beep') !== '0',
    micOnJoin: store('micOn') === '1'
  };
  $('inName').value = store('name') || '';
  $('chkMicOn').checked = prefs.micOnJoin;
  $('chkBeep').checked = prefs.beep;

  /* ---------- âm thanh: đo sóng, âm báo bộ đàm ---------- */
  function getActx(){
    if(!actx){
      var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null;
      actx = new AC();
      zeroSink = actx.createGain(); zeroSink.gain.value = 0; zeroSink.connect(actx.destination);
      if(prefs.spk && actx.setSinkId) actx.setSinkId(prefs.spk).catch(noop);
    }
    if(actx.state === 'suspended') actx.resume().catch(noop);
    return actx;
  }
  getActx();   // tạo ngay trong lúc bấm nút (điện thoại yêu cầu)
  on(ov, 'pointerdown', function(){ if(actx && actx.state === 'suspended') actx.resume().catch(noop); }, true);
  function beep(notes, vol){
    if(!prefs.beep) return;
    var c = actx; if(!c || c.state !== 'running') return;
    var t = c.currentTime;
    notes.forEach(function(f, i){
      var o = c.createOscillator(), g = c.createGain(), st = t + i * 0.09;
      o.type = 'sine'; o.frequency.value = f;

      g.gain.exponentialRampToValueAtTime(0.0001, st + 0.085);
      o.connect(g); g.connect(c.destination); o.start(st); o.stop(st + 0.1);
    });
  }
  function joinChime(){
    var c = actx; if(!c || c.state !== 'running') return;
    var t = c.currentTime;
    [660, 990].forEach(function(f, i){
      var o = c.createOscillator(), g = c.createGain(), st = t + i * 0.14;
      o.frequency.value = f; g.gain.setValueAtTime(0.0001, st); g.gain.linearRampToValueAtTime(0.09, st + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, st + 0.22);
      o.connect(g); g.connect(c.destination); o.start(st); o.stop(st + 0.24);

  function chimeUrl(){

          else if(mediaErr === 'NotAllowedError') pm.innerHTML = 'Bạn đang chặn camera và micro.<br>Bấm biểu tượng 🔒 / ⓘ cạnh địa chỉ trang → <b>Cho phép</b>, rồi bấm lại nút Video call.';

      var others = auto.filter(function(t){ return t !== focus; });
      if(W >= H * 1.1){
        var side = clamp(W * 0.22, 150, 300);
        fitIn(focus, P, P, W - side - P * 2 - G, H - P * 2);
        gridIn(others, W - P - side, P, side, H - P * 2, G);
      }else{
        var top = H * 0.62;
        fitIn(focus, P, P, W - P * 2, top - P);
        gridIn(others, P, top + G, W - P * 2, H - top - G - P, G);
      }
    }else gridIn(auto, P, P, W - P * 2, H - P * 2 - waitH, G);
    queueViews();
  }
  function toggleMax(t){
    if(t.dataset.max === '1'){
      var p = null; try{ p = JSON.parse(t.dataset.prev || 'null'); }catch(_){}
      delete t.dataset.max;
      if(p && p.m) setRect(t, p.x, p.y, p.w); else{ delete t.dataset.manual; layout(); }
      queueViews();
      return;
    }
    t.dataset.prev = JSON.stringify({ m:t.dataset.manual === '1', x:t.offsetLeft, y:t.offsetTop, w:t.offsetWidth });
    t.dataset.max = '1'; t.dataset.manual = '1'; t.style.zIndex = ++zTop;
    fitIn(t, 8, 8, stage.clientWidth - 16, stage.clientHeight - 16);
    queueViews();
  }
  function bindDrag(t){
    var mode = null, pid = null, sx = 0, sy = 0, ox = 0, oy = 0, ow = 0, moved = false, lastTap = 0;
    t.addEventListener('pointerdown', function(e){
      if(e.button > 0 || (e.target.closest && e.target.closest('.tbtn'))) return;
      var rc = t.getBoundingClientRect(), zone = e.pointerType === 'touch' ? 44 : 32;
      mode = (e.clientX > rc.right - zone && e.clientY > rc.bottom - zone) ? 'size' : 'move';
      pid = e.pointerId; try{ t.setPointerCapture(pid); }catch(_){}
      sx = e.clientX; sy = e.clientY; ox = t.offsetLeft; oy = t.offsetTop; ow = t.offsetWidth; moved = false;
      t.style.zIndex = ++zTop; t.classList.add('dragging');
      e.preventDefault();
    });
    t.addEventListener('pointermove', function(e){
      if(!mode || e.pointerId !== pid) return;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if(!moved && Math.abs(dx) + Math.abs(dy) < 5) return;
      moved = true; t.dataset.manual = '1'; delete t.dataset.max;
      var W = stage.clientWidth, H = stage.clientHeight;
      if(mode === 'move'){
        var oh = ow * 9 / 16;
        setRect(t, clamp(ox + dx, 0, Math.max(0, W - ow)), clamp(oy + dy, 0, Math.max(0, H - oh)), ow);
      }else{
        var nw = ow + Math.max(dx, dy * 16 / 9);
        nw = clamp(nw, 140, Math.max(140, Math.min(W - ox, (H - oy) * 16 / 9)));
        setRect(t, ox, oy, nw);
      }
    });
    var end = function(e){
      if(!mode || (e && e.pointerId !== pid)) return;
      mode = null; t.classList.remove('dragging');
      if(!moved){
        var now = Date.now();
        if(now - lastTap < 330){ lastTap = 0; toggleMax(t); } else lastTap = now;
      }
    };
    t.addEventListener('pointerup', end);
    t.addEventListener('pointercancel', end);
    t.addEventListener('pointerup', function(){ if(moved) queueViews(); });
  }
  $('btnLayout').onclick = function(){
    [].forEach.call(stage.querySelectorAll('.tile'), function(t){ delete t.dataset.manual; delete t.dataset.max; delete t.dataset.prev; });
    layout();
  };
  var layoutQueued = false;
  function queueLayout(){ if(layoutQueued) return; layoutQueued = true; requestAnimationFrame(function(){ layoutQueued = false; layout(); }); }
  function tileCount(){ return Object.keys(peers).filter(function(k){ return peers[k].tile; }).length; }
  function updateCount(){
    var n = tileCount();
    $('count').textContent = n + 1;
    $('wait').classList.toggle('hidden', !joined || n > 0);
  }

  /* ---------- bộ đàm: giữ để nói, chạm để mở/tắt ---------- */
  function setMic(on2, sound){
    if(!hasMic){ toast('Máy này chưa có micro hoặc chưa cấp quyền micro.'); return; }
    if(micOn === on2) return;
    micOn = on2; micTrack.enabled = on2;
    if(sound) beep(on2 ? [880, 1320] : [1320, 660]);
    refreshLocal(); broadcast();
  }
  var pressAt = 0, pressWasOn = false;
  function pressStart(){ getActx(); pressAt = Date.now(); pressWasOn = micOn; if(!micOn) setMic(true, true); }
  function pressEnd(){
    if(!pressAt) return;
    var held = Date.now() - pressAt; pressAt = 0;
    if(pressWasOn || held > 400) setMic(false, true);
  }
  pttBtn.addEventListener('pointerdown', function(e){ e.preventDefault(); try{ pttBtn.setPointerCapture(e.pointerId); }catch(_){} pressStart(); });
  pttBtn.addEventListener('pointerup', pressEnd);
  pttBtn.addEventListener('pointercancel', pressEnd);
  pttBtn.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  var spaceDown = false;
  function editable(e){
    var t = (e.composedPath && e.composedPath()[0]) || e.target;
    if(!t || !t.tagName) return false;
    return /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName) || t.isContentEditable;
  }
  on(document, 'keydown', function(e){
    if(e.code !== 'Space' || !joined || minimized || dead || editable(e)) return;
    var t = (e.composedPath && e.composedPath()[0]) || e.target;
    if(t && t.tagName === 'BUTTON') t.blur();
    e.preventDefault(); e.stopPropagation();
    if(e.repeat || spaceDown) return;
    spaceDown = true; pressStart();
  }, true);
  on(document, 'keyup', function(e){
    if(e.code !== 'Space' || !spaceDown) return;
    e.preventDefault(); e.stopPropagation(); spaceDown = false; pressEnd();
  }, true);

  /* ---------- các nút khác ---------- */
  $('btnCam').onclick = function(){
    if(!rawCam){ toast('Máy này chưa có camera hoặc chưa cấp quyền camera.'); return; }
    camOn = !camOn; rawCam.enabled = camOn; camTrack.enabled = camOn;
    refreshLocal(); broadcast();
  };
  $('btnSet').onclick = function(){ refreshDevices(); $('setModal').classList.remove('hidden'); };
  $('btnSetClose').onclick = function(){ $('setModal').classList.add('hidden'); };
  $('setModal').addEventListener('click', function(e){ if(e.target === this) this.classList.add('hidden'); });
  function stopShare(){
    if(!screenTrack) return;
    var t = screenTrack; screenTrack = null;
    t.onended = null; try{ t.stop(); }catch(_){}
    pushVideo(); refreshLocal(); broadcast(); tuneSenders();
  }
  $('btnShare').onclick = function(){
    if(screenTrack){ stopShare(); return; }
    navigator.mediaDevices.getDisplayMedia({ video:{ frameRate:{ideal:15, max:30} }, audio:false }).then(function(s){
      if(dead){ s.getTracks().forEach(function(t){ t.stop(); }); return; }
      screenTrack = s.getVideoTracks()[0];
      try{ screenTrack.contentHint = 'detail'; }catch(_){}
      screenTrack.onended = stopShare;
      pushVideo(); refreshLocal(); broadcast(); tuneSenders();
    }).catch(noop);
  };
  $('btnMin').onclick = function(){
    minimized = true; ov.style.display = 'none'; setBtn('mini'); reportViews();   // đang thu nhỏ: báo mọi người tạm ngừng gửi hình
    toast('Cuộc họp vẫn đang diễn ra – bấm nút đỏ "Đang họp" để quay lại.');
  };
  $('btnLeave').onclick = function(){ teardown(); toast('Bạn đã rời cuộc họp.'); };
  on(window, 'pagehide', function(){ teardown(); });

  function teardown(){
    if(dead) return;
    try{ broadcast({t:'bye'}); }catch(_){}
    var wasJoined = joined;
    dead = true; joined = false;
    if(wasJoined && mySlot) presWrite(String(mySlot), 'DELETE', undefined, true);
    presFast(false);
    pres.listeners = pres.listeners.filter(function(f){ return f !== lobbyPresence; });
    stopTicker();
    Object.keys(peers).forEach(function(id){
      var pr = peers[id];
      pr.conns.forEach(function(c){ try{ c.close(); }catch(_){} });
      if(pr.call){ try{ pr.call.close(); }catch(_){} }
      try{ pr.video.srcObject = null; }catch(_){}
    });
    peers = {};
    [screenTrack, procTrack, camTrack, rawCam, micTrack, meterTrack, blackT].forEach(function(t){ try{ if(t) t.stop(); }catch(_){} });
    if(seg){ try{ seg.close(); }catch(_){} }
    var pp = peer;
    setTimeout(function(){ try{ if(pp) pp.destroy(); }catch(_){} }, 300);
    try{ if(claiming) claiming.destroy(); }catch(_){}
    offs.forEach(function(f){ try{ f(); }catch(_){} });
    timers.forEach(clearInterval);
    if(ro) ro.disconnect();
    try{ if(wakeLock) wakeLock.release(); }catch(_){}
    try{ srcVideo.srcObject = null; }catch(_){}
    try{ if(actx) actx.close(); }catch(_){}
    ov.remove();
    app = null; setBtn('idle');
    if(wasJoined){ pres.list = pres.list.filter(function(p){ return p.slot !== String(mySlot); }); pres.dismissed = true; renderPresence(); }
  }

  return {
    restore: function(){
      if(!minimized) return;
      minimized = false; ov.style.display = ''; setBtn('idle');
      queueLayout();
      Object.keys(peers).forEach(function(id){ var v = peers[id].video; if(v && v.paused) playV(v); });
      reportViews();
    },
    leave: teardown,
    isJoined: function(){ return joined; },
    status: function(){ return { joined:joined, minimized:minimized, slot:mySlot, people:tileCount() + (joined ? 1 : 0), mic:micOn, cam:camOn, bg:bgMode, mobile:IS_MOBILE }; }
  };
}

/* ---------- tinh chỉnh SDP: tiếng chống rè/mất (FEC + RED), hình nét ngay từ giây đầu ---------- */
function sdpTune(sdp){
  try{
    var opus = (sdp.match(/a=rtpmap:(\d+) opus\/48000/i) || [])[1];
    if(opus){
      var fix = function(str){
        var m = {}, keys = [];
        str.split(';').forEach(function(kv){ var i = kv.indexOf('='); if(i > 0){ var k = kv.slice(0, i).trim(); if(!(k in m)) keys.push(k); m[k] = kv.slice(i + 1).trim(); } });
        // useinbandfec: tự vá gói tiếng bị mất · usedtx=0: tiếng liền, không ngắt quãng · mono 40 kbps: giọng nói rõ
        [['useinbandfec','1'], ['usedtx','0'], ['stereo','0'], ['sprop-stereo','0'], ['maxaveragebitrate','40000']].forEach(function(x){ if(!(x[0] in m)) keys.push(x[0]); m[x[0]] = x[1]; });
        return keys.map(function(k){ return k + '=' + m[k]; }).join(';');
      };
      var re = new RegExp('a=fmtp:' + opus + ' ([^\\r\\n]*)');
      if(re.test(sdp)) sdp = sdp.replace(re, function(_, prm){ return 'a=fmtp:' + opus + ' ' + fix(prm); });
      else sdp = sdp.replace(new RegExp('(a=rtpmap:' + opus + ' opus/48000[^\\r\\n]*\\r\\n)', 'i'), '$1a=fmtp:' + opus + ' ' + fix('') + '\r\n');
    }
    // RED: gửi kèm bản dự phòng của gói tiếng trước → mạng 4G rớt gói vẫn nghe liền
    var red = (sdp.match(/a=rtpmap:(\d+) red\/48000/i) || [])[1];
    if(red) sdp = sdp.replace(/(m=audio \d+ [A-Z\/]+ )([\d ]+)/, function(_, h, pts){
      return h + [red].concat(pts.trim().split(' ').filter(function(x){ return x !== red; })).join(' ');
    });
    // Hình: bắt đầu ở mức bitrate khá (không mờ mấy giây đầu), không tụt quá thấp
    var start = IS_MOBILE ? 500 : 800, vids = [];
    sdp.replace(/a=rtpmap:(\d+) (VP8|VP9|H264|AV1)\/90000/gi, function(_, pt){ vids.push(pt); return _; });
    vids.forEach(function(pt){
      var add = 'x-google-start-bitrate=' + start + ';x-google-min-bitrate=120';
      var r2 = new RegExp('a=fmtp:' + pt + ' ([^\\r\\n]*)');
      if(r2.test(sdp)) sdp = sdp.replace(r2, function(line, prm){ return /x-google-start-bitrate/.test(prm) ? line : 'a=fmtp:' + pt + ' ' + prm + ';' + add; });
      else sdp = sdp.replace(new RegExp('(a=rtpmap:' + pt + ' [A-Za-z0-9]+/90000\\r\\n)'), '$1a=fmtp:' + pt + ' ' + add + '\r\n');
    });
  }catch(_){}
  return sdp;
}

/* ---------- nạp thư viện khi cần (chỉ nạp 1 lần) ---------- */
var libs = {};
function loadScript(url, ready){
  if(ready()) return Promise.resolve();
  if(libs[url]) return libs[url];
  libs[url] = new Promise(function(res, rej){
    var s = document.createElement('script'); s.src = url; s.async = true; s.crossOrigin = 'anonymous';
    s.onload = function(){ ready() ? res() : rej(new Error('lib')); };
    s.onerror = function(){ rej(new Error('lib')); };
    document.head.appendChild(s);
  });
  libs[url].catch(function(){ delete libs[url]; });
  return libs[url];
}
function loadPeerLib(){ return loadScript(PEERJS_URL, function(){ return typeof window.Peer === 'function'; }); }
function loadSegLib(){ return loadScript(SEG_BASE + 'selfie_segmentation.js', function(){ return typeof window.SelfieSegmentation === 'function'; }); }

};
