<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IDECO Meet – Họp nội bộ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --bg:#f3f5f9; --panel:#ffffff; --line:#e1e6ee; --text:#1a2232; --muted:#667189;
    --red:#d71920; --red2:#b5121a; --green:#16a34a; --soft:#eef1f6;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent}
  button,input,select{font:inherit;color:inherit}
  .hidden{display:none!important}

  .brand{display:flex;align-items:baseline;gap:6px;font-weight:800;letter-spacing:.5px;line-height:1}
  .brand .ideco{color:var(--red);font-size:32px}
  .brand .meet{color:var(--muted);font-weight:600;font-size:18px;letter-spacing:0}

  /* ---------- Sảnh chờ ---------- */
  #lobby{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px 16px}
  .lcard{width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 10px 40px rgba(26,34,50,.08)}
  .subt{color:var(--muted);font-size:13.5px;margin:6px 0 14px}
  .preview{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--soft)}
  .preview video{width:100%;height:100%;object-fit:cover;display:block}
  .preview.mirror video,.tile.mirror video{transform:scaleX(-1)}
  .pvMsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;color:var(--muted);font-size:14px;background:var(--soft);line-height:1.5}
  .preview canvas.wave{position:absolute;left:0;right:0;bottom:0;width:100%;height:50px;background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.88))}
  .note{font-size:12.5px;color:var(--muted);margin-top:6px}
  label.f{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600}
  input[type=text],select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;outline:none}
  input[type=text]:focus,select:focus{border-color:var(--red)}
  .chk{display:flex;align-items:center;gap:9px;font-size:14px;margin-top:12px;cursor:pointer}
  .chk input{width:18px;height:18px;accent-color:var(--red);flex:none}
  .chk small{color:var(--muted)}
  .btn{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:10px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:#c5ccd8}
  .btn.primary{display:block;width:100%;margin-top:16px;background:var(--red);border-color:var(--red);color:#fff;font-weight:700;font-size:17px;padding:14px}
  .btn.primary:hover{background:var(--red2)}
  .btn.primary:disabled{opacity:.6;cursor:wait}
  .btn.sm{padding:9px 12px;font-size:13.5px}
  #lobbyMsg{margin-top:10px;font-size:13.5px;color:var(--red2);min-height:18px}
  details{margin-top:4px;border-top:1px solid var(--line);padding-top:8px}
  summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--muted);padding:6px 0}

  /* ---------- Cài đặt ---------- */
  #settings .row{display:flex;gap:8px}
  #settings .row select{flex:1;min-width:0}
  #settings canvas.wave{display:block;width:100%;height:46px;margin-top:8px;border-radius:10px;background:var(--soft)}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .bgopt{height:50px;min-width:70px;padding:0 10px;border-radius:10px;border:2px solid var(--line);background:#fff;cursor:pointer;font-size:12.5px;font-weight:600}
  .bgopt.sw{width:70px;padding:0}
  .bgopt.ideco{background:linear-gradient(#fff,#e9edf3);color:var(--red);font-weight:800;font-size:15px}
  .bgopt.active{border-color:var(--red);box-shadow:0 0 0 3px rgba(215,25,32,.15)}

  /* ---------- Phòng họp ---------- */
  #room{height:100%;display:flex;flex-direction:column}
  #top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
  #top .brand .ideco{font-size:22px}
  #top .brand .meet{font-size:14px}
  #top .info{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  #top .sp{flex:1}
  #stage{flex:1;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 0,#ffffff 0,var(--bg) 70%)}

  .tile{position:absolute;left:0;top:0;width:320px;height:180px;background:#dfe4ec;border:3px solid #fff;border-radius:14px;overflow:hidden;box-shadow:0 6px 20px rgba(26,34,50,.14);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;transition:left .25s,top .25s,width .25s,height .25s,border-color .15s,box-shadow .15s}
  .tile.dragging{transition:border-color .15s;cursor:grabbing;box-shadow:0 14px 34px rgba(26,34,50,.25)}
  .tile.speaking{border-color:var(--green);box-shadow:0 0 0 3px rgba(22,163,74,.3),0 6px 20px rgba(26,34,50,.14)}
  .tile video{width:100%;height:100%;object-fit:cover;display:block;background:#dfe4ec;pointer-events:none}
  .tile.sharing video{object-fit:contain;background:#1a2232}
  .tile .avatar{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:var(--soft);pointer-events:none}
  .tile.camoff .avatar{display:flex}
  .tile .avatar span{width:30%;max-width:96px;aspect-ratio:1;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(16px,3.4vw,38px);font-weight:800}
  .tile .label{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 46px);background:rgba(255,255,255,.92);color:var(--text);padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
  .tile .label .m{margin-right:4px}
  .tile.micon .label{color:#0f7a37}
  .tile .tag{position:absolute;left:8px;top:8px;background:var(--red);color:#fff;padding:3px 9px;border-radius:7px;font-size:11.5px;font-weight:700;display:none;pointer-events:none}
  .tile.sharing .tag{display:block}
  .tile .tbtn{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:9px;border:0;background:rgba(255,255,255,.92);cursor:pointer;font-size:17px;line-height:1;opacity:0;transition:opacity .15s}
  .tile:hover .tbtn{opacity:1}
  .tile .rs{position:absolute;right:2px;bottom:2px;width:30px;height:30px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 0 48%,rgba(255,255,255,.95) 48% 56%,transparent 56% 66%,rgba(255,255,255,.95) 66% 74%,transparent 74%)}
  @media (hover:none){ .tile .tbtn{opacity:.85} }

  #bar{display:flex;align-items:center;justify-content:center;gap:clamp(6px,2vw,16px);padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
  .ctl{width:78px;padding:8px 4px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--muted)}
  .ctl i{font-style:normal;font-size:21px;line-height:1}
  .ctl.off{background:#fdecec;border-color:#f5c2c4;color:var(--red2)}
  .ctl.on{background:#e8f6ee;border-color:#a7dcb9;color:#0f7a37}
  .ctl.leave{background:var(--red);border-color:var(--red);color:#fff}
  .ptt{display:flex;flex-direction:column;align-items:center;gap:5px;margin:0 4px}
  #btnPTT{width:70px;height:70px;border-radius:50%;border:3px solid var(--red);background:#fff;color:var(--red);font-size:28px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:0 0 0 calc(var(--lv,0) * 14px) rgba(102,113,137,.18)}
  #btnPTT.live{background:var(--red);color:#fff;box-shadow:0 0 0 calc(4px + var(--lv,0) * 22px) rgba(215,25,32,.25)}
  #pttTxt{font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap}
  #pttTxt.live{color:var(--red)}
  @media(max-width:520px){
    .ctl{width:60px;font-size:10px;padding:7px 2px}
    .ctl i{font-size:19px}
    #btnPTT{width:62px;height:62px;font-size:25px}
    #top .lnk span{display:none}
  }

  /* ---------- Hộp cài đặt, thông báo ---------- */
  #setModal{position:fixed;inset:0;background:rgba(26,34,50,.35);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
  .mcard{width:100%;max-width:470px;max-height:86vh;overflow:auto;background:#fff;border-radius:18px;padding:16px 18px 20px;box-shadow:0 20px 60px rgba(26,34,50,.25)}
  .mhead{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:17px}
  .mhead button{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:16px}
  @media(min-width:700px){ #setModal{align-items:center} }
  #toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);background:rgba(26,34,50,.92);color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;max-width:92vw;text-align:center}
  #toast.show{opacity:1}
  #soundBar{position:fixed;left:50%;top:110px;transform:translateX(-50%);z-index:55}
  #soundBar button{background:var(--red);color:#fff;border:0;padding:12px 18px;border-radius:12px;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(215,25,32,.35)}
  #srcVideo{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
</style>
</head>
<body>

<!-- ============ SẢNH CHỜ ============ -->
<div id="lobby">
  <div class="lcard">
    <div class="brand"><span class="ideco">IDECO</span><span class="meet">Meet</span></div>
    <div class="subt">Họp video nội bộ · dành cho nhân viên làm việc từ xa</div>

    <div class="preview mirror" id="pvBox">
      <video id="pvVideo" muted playsinline autoplay></video>
      <div class="pvMsg" id="pvMsg">Đang mở camera và micro…<br>Hãy bấm <b>Cho phép</b> khi trình duyệt hỏi.</div>
      <canvas class="wave" id="pvWave"></canvas>
    </div>
    <div class="note">🎤 Nói thử: sóng âm đỏ nhảy theo giọng là micro đã hoạt động.</div>

    <label class="f" for="inName">Tên của bạn</label>
    <input id="inName" type="text" maxlength="30" placeholder="Ví dụ: Huyền – Kế toán" autocomplete="name">
    <label class="chk"><input type="checkbox" id="chkMicOn"> Vào họp với micro bật sẵn <small>(mặc định: giữ nút để nói)</small></label>

    <button class="btn primary" id="btnJoin" type="button">Vào họp</button>
    <div id="lobbyMsg"></div>

    <details id="lobbySet">
      <summary>⚙️ Chọn camera, micro, loa và phông nền</summary>
      <div id="setSlotLobby">
        <div id="settings">
          <label class="f" for="selCam">📷 Camera</label>
          <select id="selCam"></select>
          <label class="f" for="selMic">🎤 Micro (có thể chọn micro rời, tai nghe)</label>
          <select id="selMic"></select>
          <canvas class="wave" id="setWave"></canvas>
          <div id="rowSpk">
            <label class="f" for="selSpk">🔊 Loa / tai nghe</label>
            <div class="row"><select id="selSpk"></select><button class="btn sm" id="btnTestSpk" type="button">Thử loa</button></div>
          </div>
          <label class="f">🖼️ Phông nền</label>
          <div class="opts" id="bgOpts">
            <button class="bgopt ideco" data-bg="ideco" type="button" title="Nền sáng, chữ IDECO đỏ">IDECO</button>
            <button class="bgopt" data-bg="none" type="button">Không</button>
            <button class="bgopt" data-bg="blur" type="button">Làm mờ</button>
            <button class="bgopt sw" data-bg="light" type="button" title="Trắng sáng" style="background:linear-gradient(135deg,#ffffff,#dfe5ee)"></button>
            <button class="bgopt sw" data-bg="warm" type="button" title="Be ấm" style="background:linear-gradient(135deg,#fbf3e6,#e3c79f)"></button>
            <button class="bgopt sw" data-bg="teal" type="button" title="Xanh nhạt" style="background:linear-gradient(135deg,#eefaf7,#a9dcd1)"></button>
            <button class="bgopt" data-bg="image" type="button">📁 Ảnh riêng</button>
          </div>
          <label class="chk"><input type="checkbox" id="chkBright"> ✨ Làm sáng và đẹp hình <small id="brightNote"></small></label>
          <label class="chk"><input type="checkbox" id="chkBeep"> 📻 Âm báo bộ đàm khi bắt đầu / kết thúc nói</label>
        </div>
      </div>
    </details>
  </div>
</div>

<!-- ============ PHÒNG HỌP ============ -->
<div id="room" class="hidden">
  <div id="top">
    <div class="brand"><span class="ideco">IDECO</span><span class="meet">Meet</span></div>
    <span class="info"><span id="roomName"></span> · <span id="count">1</span> người</span>
    <span class="sp"></span>
    <button class="btn sm" id="btnLayout" type="button" title="Xếp lại các khung video">⊞ <span>Xếp lại</span></button>
    <button class="btn sm lnk" id="btnLink" type="button" title="Sao chép link mời">🔗 <span>Mời</span></button>
  </div>
  <div id="stage"></div>
  <div id="bar">
    <button class="ctl on" id="btnCam" type="button"><i>📷</i><span>Camera</span></button>
    <button class="ctl" id="btnSet" type="button"><i>⚙️</i><span>Cài đặt</span></button>
    <div class="ptt">
      <button id="btnPTT" type="button" aria-label="Giữ để nói">🎤</button>
      <span id="pttTxt">Giữ để nói</span>
    </div>
    <button class="ctl" id="btnShare" type="button"><i>🖥️</i><span>Màn hình</span></button>
    <button class="ctl leave" id="btnLeave" type="button"><i>📞</i><span>Rời họp</span></button>
  </div>
</div>

<div id="setModal" class="hidden">
  <div class="mcard">
    <div class="mhead">Cài đặt <button id="btnSetClose" type="button" aria-label="Đóng">✕</button></div>
    <div id="setSlotRoom"></div>
  </div>
</div>
<div id="soundBar" class="hidden"><button id="btnSound" type="button">🔊 Bấm để nghe tiếng</button></div>
<input type="file" id="bgFile" accept="image/*" class="hidden">
<video id="srcVideo" muted playsinline></video>
<div id="toast"></div>

<script>
(function(){
  'use strict';
  var MAX = 8;                          // số người tối đa mỗi phòng
  var PREFIX = 'ideco-meet-v1-';        // tiền tố ID trên máy chủ kết nối
  var DEFAULT_ROOM = 'idecohopnoibo';   // phòng chung của công ty (link có #tenphong sẽ vào phòng riêng)

  var $ = function(id){ return document.getElementById(id); };
  var noop = function(){};
  function store(k, v){ try{ if(v === undefined) return localStorage.getItem(k); localStorage.setItem(k, String(v)); }catch(e){ return null; } }
  var toastT;
  function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('show'); }, 3400); }
  function lobbyMsg(m){ $('lobbyMsg').textContent = m || ''; }
  function cleanRoom(s){ return (s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
  function slotOf(id){ return parseInt(id.slice(id.lastIndexOf('-') + 1), 10) || 0; }
  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

  /* ---------- trạng thái ---------- */
  var peer = null, myId = '', mySlot = 0, room = '', myName = '', joined = false, left = false;
  var rawCam = null, procTrack = null, camTrack = null, micTrack = null, meterTrack = null, screenTrack = null, outStream = null, blackT = null;
  var hasCam = false, hasMic = false, micOn = false, camOn = false;
  var peers = {};
  var actx = null, zeroSink = null;
  var stage = $('stage'), srcVideo = $('srcVideo'), pttBtn = $('btnPTT');
  var localTile = null, localVideo = null, zTop = 10;
  var prefs = {
    cam: store('imCam') || '', mic: store('imMic') || '', spk: store('imSpk') || '',
    bg: store('imBg') || 'ideco', bright: store('imBright') !== '0', beep: store('imBeep') !== '0',
    micOnJoin: store('imMicOn') === '1'
  };

  $('inName').value = store('imName') || '';
  $('chkMicOn').checked = prefs.micOnJoin;
  $('chkBeep').checked = prefs.beep;

  /* ---------- âm thanh nền (đo sóng, âm báo) ---------- */
  function getActx(){
    if(!actx){
      var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null;
      actx = new AC();
      zeroSink = actx.createGain(); zeroSink.gain.value = 0; zeroSink.connect(actx.destination);
      if(prefs.spk && actx.setSinkId) actx.setSinkId(prefs.spk).catch(noop);
    }
    if(actx.state === 'suspended') actx.resume().catch(noop);
    return actx;
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach(function(ev){
    document.addEventListener(ev, function(){ if(actx && actx.state === 'suspended') actx.resume().catch(noop); }, true);
  });
  function beep(notes, vol){
    if(!prefs.beep) return;
    var c = actx; if(!c || c.state !== 'running') return;
    var t = c.currentTime;
    notes.forEach(function(f, i){
      var o = c.createOscillator(), g = c.createGain(), st = t + i * 0.09;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.linearRampToValueAtTime(vol || 0.12, st + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, st + 0.085);
      o.connect(g); g.connect(c.destination); o.start(st); o.stop(st + 0.1);
    });
  }
  function chimeUrl(){
    var sr = 22050, n = Math.floor(sr * 0.95), buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    var ws = function(o, s){ for(var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
    ws(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); ws(8, 'WAVE'); ws(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    ws(36, 'data'); v.setUint32(40, n * 2, true);
    var notes = [660, 880, 1100];
    for(var i = 0; i < n; i++){
      var t = i / sr, k = Math.min(2, Math.floor(t / 0.3)), lt = t - k * 0.3;
      var a = Math.exp(-lt * 6) * Math.min(1, lt * 300) * 0.5;
      v.setInt16(44 + i * 2, Math.sin(2 * Math.PI * notes[k] * t) * a * 32767, true);
    }
    return URL.createObjectURL(new Blob([buf], {type:'audio/wav'}));
  }

  /* ---------- camera / micro ---------- */
  var VBASE = { width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:30, max:30} };
  var ABASE = { echoCancellation:true, noiseSuppression:true, autoGainControl:true, channelCount:{ideal:1}, sampleRate:{ideal:48000} };
  function cons(base, id, exact){
    var c = {}; for(var k in base) c[k] = base[k];
    if(id) c.deviceId = exact ? {exact:id} : {ideal:id};
    return c;
  }
  function gum(c){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return Promise.reject(new Error('insecure'));
    return navigator.mediaDevices.getUserMedia(c);
  }
  function makeBlack(){
    if(blackT && blackT.readyState === 'live') return blackT;
    var c = document.createElement('canvas'); c.width = 640; c.height = 360;
    var x = c.getContext('2d');
    var draw = function(){ x.fillStyle = '#eef1f6'; x.fillRect(0, 0, 640, 360); };
    draw(); setInterval(draw, 1000);
    blackT = c.captureStream(2).getVideoTracks()[0];
    return blackT;
  }
  function silentTrack(){
    var c = getActx();
    if(!c) return makeBlack().clone();
    return c.createMediaStreamDestination().stream.getAudioTracks()[0];
  }
  function rebuildOut(){ outStream = new MediaStream([screenTrack || camTrack, micTrack]); }

  var mediaErr = '';
  function startMedia(){
    var V = cons(VBASE, prefs.cam), A = cons(ABASE, prefs.mic);
    if(!prefs.cam) V.facingMode = 'user';
    return gum({video:V, audio:A})
      .catch(function(e){ mediaErr = (e && e.message === 'insecure') ? 'insecure' : (e && e.name) || 'x'; return gum({video:false, audio:A}); })
      .catch(function(){ return gum({video:V, audio:false}); })
      .catch(function(){ return null; })
      .then(function(s){
        var v = s && s.getVideoTracks()[0], a = s && s.getAudioTracks()[0];
        rawCam = v || null; hasCam = !!v; camOn = hasCam;
        hasMic = !!a;
        micTrack = a || silentTrack();
        micTrack.enabled = false;
        if(a){ try{ a.contentHint = 'speech'; }catch(_){} meterTrack = a.clone(); }
        camTrack = rawCam || makeBlack();

  /* ---------- kết nối giữa các thành viên ---------- */
  function getPeer(id){
    var pr = peers[id];
    if(!pr){
      var t = makeTile(id);
      pr = peers[id] = { conns:[], call:null, state:{name:'Thành viên ' + slotOf(id), mic:false, cam:true, share:false}, tile:t.tile, video:t.video };
      if(prefs.spk && pr.video.setSinkId) pr.video.setSinkId(prefs.spk).catch(noop);
      renderTile(pr.tile, pr.state, false);
      updateCount(); layout();
    }
    return pr;
  }
  function setupConn(conn){
    conn.on('open', function(){
      var pr = getPeer(conn.peer);
      pr.conns = pr.conns.filter(function(c){ return c.open; });
      if(!pr.conns.length && pr.call){ try{ pr.call.close(); }catch(_){} pr.call = null; }
      pr.conns.push(conn);
      conn.send(myState());
      if(mySlot < slotOf(conn.peer) && !pr.call) setupCall(peer.call(conn.peer, outStream));
    });
    conn.on('data', function(d){ onData(conn.peer, d); });
    conn.on('close', function(){ dropConn(conn); });
    conn.on('error', function(){ dropConn(conn); });
  }
  function dropConn(conn){
    var pr = peers[conn.peer]; if(!pr) return;
    pr.conns = pr.conns.filter(function(c){ return c !== conn && c.open; });
    if(!pr.conns.length) removePeer(conn.peer);
  }
  function playV(v){ var p = v.play(); if(p && p.catch) p.catch(function(){ $('soundBar').classList.remove('hidden'); }); }
  $('btnSound').onclick = function(){
    $('soundBar').classList.add('hidden'); getActx();
    Object.keys(peers).forEach(function(id){ playV(peers[id].video); });
  };
  function attachLevel(pr, s){
    var c = getActx(); if(!c || !s.getAudioTracks().length) return;
    try{
      if(pr.src) pr.src.disconnect();
      if(!pr.an){ pr.an = c.createAnalyser(); pr.an.fftSize = 512; pr.buf = new Uint8Array(512); pr.an.connect(zeroSink); }
      pr.src = c.createMediaStreamSource(s); pr.src.connect(pr.an);
    }catch(_){}
  }
  function setupCall(call){
    if(!call) return;
    var id = call.peer, pr = getPeer(id);
    if(pr.call && pr.call !== call){ var old = pr.call; pr.call = call; try{ old.close(); }catch(_){} }
    pr.call = call;
    call.on('stream', function(s){
      if(pr.video.srcObject !== s){ pr.video.srcObject = s; attachLevel(pr, s); }
      playV(pr.video);
      setTimeout(tuneSenders, 1500);
    });
    call.on('close', function(){ if(pr.call === call) pr.call = null; });
    call.on('error', function(){ if(pr.call === call) pr.call = null; });
    var pc = call.peerConnection;
    if(pc){
      pc.addEventListener('iceconnectionstatechange', function(){
        var st = pc.iceConnectionState;
        if(st === 'connected' || st === 'completed') tuneSenders();
        else if(st === 'failed'){ if(peers[id] && peers[id].call === call) removePeer(id, true); }
        else if(st === 'disconnected'){
          setTimeout(function(){ if(pc.iceConnectionState === 'disconnected' && peers[id] && peers[id].call === call) removePeer(id, true); }, 8000);
        }
      });
    }
  }
  // Ưu tiên tiếng nói rõ; chia băng thông hình theo số người
  function tuneSenders(){
    var n = Object.keys(peers).length;
    var vb = n <= 1 ? 1500000 : n <= 3 ? 900000 : 550000;
    Object.keys(peers).forEach(function(id){
      var c = peers[id].call, pc = c && c.peerConnection; if(!pc || !pc.getSenders) return;
      pc.getSenders().forEach(function(s){
        if(!s.track || !s.getParameters || !s.setParameters) return;
        try{
          var p = s.getParameters(); if(!p.encodings || !p.encodings.length) return;
          p.encodings.forEach(function(e){
            if(s.track.kind === 'audio'){ e.maxBitrate = 64000; e.priority = 'high'; e.networkPriority = 'high'; }
            else e.maxBitrate = screenTrack ? Math.max(vb, 1200000) : vb;
          });
          s.setParameters(p).catch(noop);
        }catch(_){}
      });
    });
  }
  function removePeer(id, lost){
    var pr = peers[id]; if(!pr) return;
    delete peers[id];
    pr.conns.forEach(function(c){ try{ c.close(); }catch(_){} });
    if(pr.call){ try{ pr.call.close(); }catch(_){} }
    try{ if(pr.src) pr.src.disconnect(); }catch(_){}
    pr.video.srcObject = null;
    pr.tile.remove();
    updateCount(); layout(); tuneSenders();
    toast(pr.state.name + (lost ? ' bị mất kết nối' : ' đã rời họp'));
  }
  function onData(id, d){
    var pr = peers[id]; if(!pr || !d) return;
    if(d.t === 'bye'){ removePeer(id); return; }
    if(d.t === 'state'){
      var was = pr.state;
      pr.state = { name:String(d.name || '').slice(0, 30) || was.name, mic:!!d.mic, cam:!!d.cam, share:!!d.share };
      renderTile(pr.tile, pr.state, false);
      if(pr.state.mic && !was.mic) beep([740], 0.05);
      if(pr.state.share !== was.share){
        if(pr.state.share) toast(pr.state.name + ' đang chia sẻ màn hình');
        layout(); tuneSenders();
      }
    }
  }
  function broadcast(msg){
    msg = msg || myState();
    Object.keys(peers).forEach(function(id){
      var c = peers[id].conns.filter(function(x){ return x.open; })[0];
      if(c){ try{ c.send(msg); }catch(_){} }
    });
  }
  // Viền xanh khi người khác đang nói thật
  setInterval(function(){
    Object.keys(peers).forEach(function(id){
      var pr = peers[id]; if(!pr.an) return;
      pr.an.getByteTimeDomainData(pr.buf);
      var s = 0; for(var i = 0; i < pr.buf.length; i++){ var d = (pr.buf[i] - 128) / 128; s += d * d; }
      pr.lv = (pr.lv || 0) * 0.5 + Math.sqrt(s / pr.buf.length) * 0.5;
      pr.tile.classList.toggle('speaking', pr.state.mic && pr.lv > 0.02);
    });
  }, 120);

  /* ---------- khung video: kéo di chuyển, kéo góc phóng to/thu nhỏ ---------- */
  function makeTile(id){
    var tile = document.createElement('div'); tile.className = 'tile'; tile.dataset.id = id;
    var v = document.createElement('video'); v.autoplay = true; v.playsInline = true; v.setAttribute('playsinline', '');
    var av = document.createElement('div'); av.className = 'avatar'; av.appendChild(document.createElement('span'));
    var tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = 'Đang chia sẻ màn hình';
    var lb = document.createElement('div'); lb.className = 'label';
    var m = document.createElement('span'); m.className = 'm';
    var n = document.createElement('span'); n.className = 'n';
    lb.appendChild(m); lb.appendChild(n);
    var mx = document.createElement('button'); mx.className = 'tbtn'; mx.type = 'button'; mx.title = 'Phóng to / thu nhỏ'; mx.textContent = '⤢';
    mx.onclick = function(e){ e.stopPropagation(); toggleMax(tile); };
    var rs = document.createElement('div'); rs.className = 'rs'; rs.title = 'Kéo để đổi cỡ';
    tile.appendChild(v); tile.appendChild(av); tile.appendChild(tag); tile.appendChild(lb); tile.appendChild(mx); tile.appendChild(rs);
    var W = stage.clientWidth || 640, H = stage.clientHeight || 400;
    setRect(tile, W / 2 - 120, H / 2 - 68, 240);
    stage.appendChild(tile);
    bindDrag(tile);
    return { tile:tile, video:v };
  }
  function renderTile(tile, st, isMe){
    tile.querySelector('.n').textContent = st.name + (isMe ? ' (bạn)' : '');
    tile.querySelector('.m').textContent = st.mic ? '🎤' : '🔇';
    tile.querySelector('.avatar span').textContent = (st.name.trim()[0] || '?').toUpperCase();
    tile.classList.toggle('micon', !!st.mic);
    tile.classList.toggle('camoff', !st.cam && !st.share);
    tile.classList.toggle('sharing', !!st.share);
  }
  function setRect(t, x, y, w){
    t.style.left = Math.round(x) + 'px'; t.style.top = Math.round(y) + 'px';
    t.style.width = Math.round(w) + 'px'; t.style.height = Math.round(w * 9 / 16) + 'px';
  }
  function fitIn(t, X, Y, W, H){ var w = Math.max(80, Math.min(W, H * 16 / 9)); setRect(t, X + (W - w) / 2, Y + (H - w * 9 / 16) / 2, w); }
  function gridIn(list, X, Y, W, H, G){
    var n = list.length; if(!n) return;
    var best = null;
    for(var cols = 1; cols <= n; cols++){
      var rows = Math.ceil(n / cols);
      var w = Math.min((W - G * (cols - 1)) / cols, ((H - G * (rows - 1)) / rows) * 16 / 9);
      if(!best || w > best.w) best = { cols:cols, rows:rows, w:w };
    }
    var tw = Math.max(80, Math.floor(best.w)), th = tw * 9 / 16;
    var y0 = Y + (H - (best.rows * th + (best.rows - 1) * G)) / 2;
    list.forEach(function(t, i){
      var r = Math.floor(i / best.cols), c = i % best.cols;
      var inRow = Math.min(best.cols, n - r * best.cols), rowW = inRow * tw + (inRow - 1) * G;
      setRect(t, X + (W - rowW) / 2 + c * (tw + G), y0 + r * (th + G), tw);
    });
  }
  function clampTile(t, W, H){
    var w = Math.min(t.offsetWidth, W - 8, (H - 8) * 16 / 9);
    var x = clamp(t.offsetLeft, 0, Math.max(0, W - w)), y = clamp(t.offsetTop, 0, Math.max(0, H - w * 9 / 16));
    setRect(t, x, y, w);
  }
  function layout(){
    if(!joined) return;
    var W = stage.clientWidth, H = stage.clientHeight, G = 10, P = 12;
    if(!W || !H) return;
    var all = [].slice.call(stage.querySelectorAll('.tile'));
    all.forEach(function(t){
      if(t.dataset.max === '1') fitIn(t, 8, 8, W - 16, H - 16);
      else if(t.dataset.manual === '1') clampTile(t, W, H);
    });
    var auto = all.filter(function(t){ return t.dataset.manual !== '1'; });
    // người khác đang chia sẻ màn hình: khung đó to, các khung còn lại xếp bên cạnh
    var focus = auto.filter(function(t){ return t.classList.contains('sharing') && t !== localTile; })[0];
    if(focus && auto.length > 1){
      var others = auto.filter(function(t){ return t !== focus; });
      if(W >= H * 1.1){
        var side = clamp(W * 0.22, 150, 300);
        fitIn(focus, P, P, W - side - P * 2 - G, H - P * 2);
        gridIn(others, W - P - side, P, side, H - P * 2, G);
      }else{
        var top = H * 0.62;
        fitIn(focus, P, P, W - P * 2, top - P);
        gridIn(others, P, top + G, W - P * 2, H - top - G - P, G);
      }
    }else gridIn(auto, P, P, W - P * 2, H - P * 2, G);
  }
  function toggleMax(t){
    if(t.dataset.max === '1'){
      var p = null; try{ p = JSON.parse(t.dataset.prev || 'null'); }catch(_){}
      delete t.dataset.max;
      if(p && p.m) setRect(t, p.x, p.y, p.w); else{ delete t.dataset.manual; layout(); }
      return;
    }
    t.dataset.prev = JSON.stringify({ m:t.dataset.manual === '1', x:t.offsetLeft, y:t.offsetTop, w:t.offsetWidth });
    t.dataset.max = '1'; t.dataset.manual = '1'; t.style.zIndex = ++zTop;
    fitIn(t, 8, 8, stage.clientWidth - 16, stage.clientHeight - 16);
  }
  function bindDrag(t){
    var mode = null, pid = null, sx = 0, sy = 0, ox = 0, oy = 0, ow = 0, moved = false, lastTap = 0;
    t.addEventListener('pointerdown', function(e){
      if(e.button > 0 || (e.target.closest && e.target.closest('.tbtn'))) return;
      var rc = t.getBoundingClientRect(), zone = e.pointerType === 'touch' ? 44 : 32;
      mode = (e.clientX > rc.right - zone && e.clientY > rc.bottom - zone) ? 'size' : 'move';   // góc dưới phải = đổi cỡ
      pid = e.pointerId; try{ t.setPointerCapture(pid); }catch(_){}
      sx = e.clientX; sy = e.clientY; ox = t.offsetLeft; oy = t.offsetTop; ow = t.offsetWidth; moved = false;
      t.style.zIndex = ++zTop; t.classList.add('dragging');
      e.preventDefault();
    });
    t.addEventListener('pointermove', function(e){
      if(!mode || e.pointerId !== pid) return;
      var dx = e.clientX - sx, dy = e.clientY - sy;
      if(!moved && Math.abs(dx) + Math.abs(dy) < 5) return;
      moved = true; t.dataset.manual = '1'; delete t.dataset.max;
      var W = stage.clientWidth, H = stage.clientHeight;
      if(mode === 'move'){
        var oh = ow * 9 / 16;
        setRect(t, clamp(ox + dx, 0, Math.max(0, W - ow)), clamp(oy + dy, 0, Math.max(0, H - oh)), ow);
      }else{
        var nw = ow + Math.max(dx, dy * 16 / 9);
        nw = clamp(nw, 140, Math.max(140, Math.min(W - ox, (H - oy) * 16 / 9)));
        setRect(t, ox, oy, nw);
      }
    });
    var end = function(e){
      if(!mode || (e && e.pointerId !== pid)) return;
      mode = null; t.classList.remove('dragging');
      if(!moved){
        var now = Date.now();
        if(now - lastTap < 330){ lastTap = 0; toggleMax(t); } else lastTap = now;   // chạm 2 lần: phóng to / thu nhỏ
      }
    };
    t.addEventListener('pointerup', end);
    t.addEventListener('pointercancel', end);
  }
  $('btnLayout').onclick = function(){
    [].forEach.call(stage.querySelectorAll('.tile'), function(t){ delete t.dataset.manual; delete t.dataset.max; delete t.dataset.prev; });
    layout();
  };
  var layoutQueued = false;
  function queueLayout(){ if(layoutQueued) return; layoutQueued = true; requestAnimationFrame(function(){ layoutQueued = false; layout(); }); }
  if(window.ResizeObserver) new ResizeObserver(queueLayout).observe(stage);
  else window.addEventListener('resize', queueLayout);
  function updateCount(){ $('count').textContent = Object.keys(peers).length + 1; }

  /* ---------- bộ đàm: giữ để nói, chạm để mở/tắt ---------- */
  function setMic(on, sound){
    if(!hasMic){ toast('Máy này chưa có micro hoặc chưa cấp quyền micro.'); return; }
    if(micOn === on) return;
    micOn = on; micTrack.enabled = on;
    if(sound) beep(on ? [880, 1320] : [1320, 660]);
    refreshLocal(); broadcast();
  }
  var pressAt = 0, pressWasOn = false;
  function pressStart(){ getActx(); pressAt = Date.now(); pressWasOn = micOn; if(!micOn) setMic(true, true); }
  function pressEnd(){
    if(!pressAt) return;
    var held = Date.now() - pressAt; pressAt = 0;
    if(pressWasOn || held > 400) setMic(false, true);   // giữ lâu rồi thả = tắt; chạm nhanh = để mở
  }
  pttBtn.addEventListener('pointerdown', function(e){ e.preventDefault(); try{ pttBtn.setPointerCapture(e.pointerId); }catch(_){} pressStart(); });
  pttBtn.addEventListener('pointerup', pressEnd);
  pttBtn.addEventListener('pointercancel', pressEnd);
  pttBtn.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  var spaceDown = false;
  document.addEventListener('keydown', function(e){
    if(e.code !== 'Space' || !joined) return;
    var tg = e.target.tagName;
    if(tg === 'INPUT' || tg === 'SELECT' || tg === 'TEXTAREA') return;
    if(tg === 'BUTTON') e.target.blur();
    e.preventDefault();
    if(e.repeat || spaceDown) return;
    spaceDown = true; pressStart();
  });
  document.addEventListener('keyup', function(e){
    if(e.code !== 'Space' || !spaceDown) return;
    e.preventDefault(); spaceDown = false; pressEnd();
  });

  /* ---------- các nút khác ---------- */
  $('btnCam').onclick = function(){
    if(!rawCam){ toast('Máy này chưa có camera hoặc chưa cấp quyền camera.'); return; }
    camOn = !camOn; rawCam.enabled = camOn; camTrack.enabled = camOn;
    refreshLocal(); broadcast();
  };
  $('btnSet').onclick = function(){ refreshDevices(); $('setModal').classList.remove('hidden'); };
  $('btnSetClose').onclick = function(){ $('setModal').classList.add('hidden'); };
  $('setModal').addEventListener('click', function(e){ if(e.target === this) this.classList.add('hidden'); });

  function stopShare(){
    if(!screenTrack) return;
    var t = screenTrack; screenTrack = null;
    t.onended = null; try{ t.stop(); }catch(_){}
    pushVideo(); refreshLocal(); broadcast(); tuneSenders();
  }
  $('btnShare').onclick = function(){
    if(screenTrack){ stopShare(); return; }
    navigator.mediaDevices.getDisplayMedia({ video:{ frameRate:{ideal:15, max:30} }, audio:false }).then(function(s){
      screenTrack = s.getVideoTracks()[0];
      try{ screenTrack.contentHint = 'detail'; }catch(_){}   // ưu tiên chữ nét khi chia sẻ màn hình
      screenTrack.onended = stopShare;
      pushVideo(); refreshLocal(); broadcast(); tuneSenders();
    }).catch(noop);
  };
  $('btnLink').onclick = function(){
    var url = location.href.split('#')[0] + (room === DEFAULT_ROOM ? '' : '#' + room);
    var ok = function(){ toast('Đã sao chép link mời – gửi cho đồng nghiệp qua Zalo.'); };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(ok, function(){ prompt('Sao chép link mời:', url); });
    else prompt('Sao chép link mời:', url);
  };
  function leave(){
    if(left) return; left = true;
    broadcast({t:'bye'});
    stopTicker();
    [screenTrack, camTrack, rawCam, micTrack, meterTrack].forEach(function(t){ try{ if(t) t.stop(); }catch(_){} });
    try{ if(peer) peer.destroy(); }catch(_){}
  }
  $('btnLeave').onclick = function(){ leave(); setTimeout(function(){ location.reload(); }, 150); };
  window.addEventListener('pagehide', leave);
})();
</script>
</body>
</html>
